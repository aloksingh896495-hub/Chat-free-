    // an analytics tab doesn't re-download the whole collection every time.
    // Call kolaCache.invalidate('key') after writes that should force a refresh.
    window.kolaCache = (() => {
        const store = new Map(); // key -> { data, ts }
        const TTL_MS = 60 * 1000; // 60 seconds
        return {
            async get(key, fetchFn, force = false) {
                const hit = store.get(key);
                if (!force && hit && (Date.now() - hit.ts) < TTL_MS) {
                    return hit.data;
                }
                const data = await fetchFn();
                store.set(key, { data, ts: Date.now() });
                return data;
            },
            invalidate(key) {
                if (key) store.delete(key);
                else store.clear();
            }
        };
    })();

    // ── Expose Firestore helpers for analytics (same version, same instance) ──
    window._fs = { collection, addDoc, getDocs, onSnapshot, doc, deleteDoc, query, orderBy, limit, updateDoc, setDoc, getDoc, increment, where, arrayUnion, deleteField };

/* ════════════════════════════════════════════════════════
   SWIPE-TO-REPLY (new) — drag any message bubble to the right
   (WhatsApp-style) to quote-reply to it. Works via one delegated
   touch listener per chat container, so it applies to every
   bubble automatically without touching renderBubble's markup.
════════════════════════════════════════════════════════ */
window.kolaSwipe = {
    _bubble: null, _row: null, _ctx: null, _msgId: null,
    _startX: 0, _startY: 0, _dragging: false, _armed: false,

    init(containerId, ctx) {
        const box = document.getElementById(containerId);
        if (!box || box.dataset.swipeInit) return;
        box.dataset.swipeInit = '1';
        box.addEventListener('touchstart', e => this._down(e, ctx), { passive: true });
        box.addEventListener('touchmove',  e => this._move(e), { passive: false });
        box.addEventListener('touchend',   () => this._up(), { passive: true });
        box.addEventListener('touchcancel',() => this._up(), { passive: true });
    },

    _down(e, ctx) {
        const row = e.target.closest('.kola-msg-row-chat');
        if (!row) return;
        const bubble = row.querySelector('.kola-bubble-chat');
        if (!bubble) return;
        this._row = row; this._bubble = bubble; this._ctx = ctx;
        this._msgId = row.dataset.msgId || '';
        this._startX = e.touches[0].clientX;
        this._startY = e.touches[0].clientY;
        this._dragging = false; this._armed = false;
        bubble.style.transition = 'none';
        if (!row.querySelector('.kola-swipe-reply-icon')) {
            row.insertAdjacentHTML('afterbegin', '<div class="kola-swipe-reply-icon"><i class="fa-solid fa-reply"></i></div>');
        }
    },

    _move(e) {
        if (!this._bubble) return;
        const dx = e.touches[0].clientX - this._startX;
        const dy = e.touches[0].clientY - this._startY;
        if (!this._dragging) {
            if (Math.abs(dx) < 8 || Math.abs(dy) > Math.abs(dx)) return; // let vertical scroll pass through
            this._dragging = true;
        }
        if (dx < 0) { this._bubble.style.transform = 'translateX(0)'; return; } // only swipe-right triggers reply
        e.preventDefault();
        const clamped = Math.min(dx, 72);
        this._bubble.style.transform = `translateX(${clamped}px)`;
        this._armed = clamped > 48;
        if (this._row) this._row.classList.toggle('kola-swipe-armed', this._armed);
    },

    _up() {
        if (!this._bubble) return;
        this._bubble.style.transition = 'transform 0.2s cubic-bezier(.4,0,.2,1)';
        this._bubble.style.transform = 'translateX(0)';
        if (this._row) this._row.classList.remove('kola-swipe-armed');
        if (this._armed && this._dragging && window.kolaReply) {
            const text = this._bubble.dataset.text || '';
            kolaReply.set(this._msgId, text, this._ctx);
            if (navigator.vibrate) navigator.vibrate(12);
        }
        this._bubble = null; this._row = null; this._dragging = false; this._armed = false;
    }
};

/* ════════════════════════════════════
   IMAGE COMPRESSION — shrink + re-encode photos in the browser
   before they're uploaded. Chat images are often full-resolution
   camera photos (several MB each), which is what makes upload feel
   like it's stuck, especially on a slow connection. This cuts most
   photos down to under ~300KB before they ever leave the phone.
════════════════════════════════════ */
async function kolaCompressImageForUpload(file, maxDim = 1600, quality = 0.72) {
    if (!file || file.type === 'image/gif') return file;   // keep GIFs (animation) untouched
    if (file.size < 200 * 1024) return file;                // already small — not worth the CPU work
    try {
        const bitmap = await createImageBitmap(file);
        let { width, height } = bitmap;
        if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
        if (!blob || blob.size >= file.size) return file;   // compression didn't actually help — use original
        const newName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
        return new File([blob], newName, { type: 'image/jpeg' });
    } catch (e) {
        console.warn('[image-compress] falling back to original file:', e);
        return file;
    }
}
window.kolaCompressImageForUpload = kolaCompressImageForUpload;

        // Ask for notification permission here — opening chat is a clear signal the
        // person wants replies, so this is the natural moment (not an unsolicited
        // page-load prompt, which most browsers auto-block anyway).
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
    },

    close() {
        document.getElementById('kola-chat-screen').classList.remove('open');
        document.body.style.overflow = '';
        if (_chatUnsub) { _chatUnsub(); _chatUnsub = null; }
        if (_kolaTypingUnsub) { _kolaTypingUnsub(); _kolaTypingUnsub = null; }
        clearTimeout(_studentTypingTimer);
        _setTypingFlag(getUserId() + '__' + _kolaChatChannel, 'userTyping', false); // don't leave a stale "typing…" behind
        _kolaChatRenderedIds.clear();
        if (window.kolaSelect) kolaSelect.exit();
    },

    // Listens for the admin typing a reply to THIS student, on THIS channel, and
    // shows/hides the WhatsApp-style "…" bubble above the message list in real time.
    _listenTyping() {
        if (_kolaTypingUnsub) _kolaTypingUnsub();
        const { doc, onSnapshot } = window._fs;
        const typingId = getUserId() + '__' + _kolaChatChannel;
        _kolaTypingUnsub = onSnapshot(doc(window._kolaDB, 'typingStatus', typingId), (snap) => {
            const el = document.getElementById('kola-typing-indicator');
            if (!el) return;
            const data = snap.exists() ? snap.data() : null;
            const isTyping = !!(data && data.adminTyping && (Date.now() - (data.adminTypingAt || 0)) < TYPING_STALE_MS);
            el.classList.toggle('show', isTyping);
            if (isTyping) {
                const box = document.getElementById('kola-chat-messages');
                if (box) box.scrollTop = box.scrollHeight;
            }
        }, () => {});
    },

    _listen() {
        if (_chatUnsub) _chatUnsub();
        const { collection, query, where, onSnapshot, limit } = window._fs;
        const db  = window._kolaDB;
        const uid = getUserId();
        _lastDateLabel = '';

        // Equality-only filters (userId + channel) — no composite index required,
        // and channel keeps Developer / Khufia Agent messages completely separate.
        const q = query(
            collection(db, 'supportChats'),
            where('userId', '==', uid),
            where('channel', '==', _kolaChatChannel),
            limit(200)
        );

        _chatUnsub = onSnapshot(q, (snap) => {
            const box = document.getElementById('kola-chat-messages');
            if (!box) return;

            if (snap.empty) {
                box.innerHTML = `<div id="kola-chat-empty">
                    <div class="empty-icon">💬</div>
                    <h3>Start a Conversation</h3>
                    <p>Say hello! We're here to help with any questions about Kola Bro.</p>
                </div>`;
                _kolaChatRenderedIds.clear();
                return;
            }

            // First load (or a real re-sort need): do a full render once, then
            // switch to incremental appends for speed on every update after that.
            const isFirstRender = _kolaChatRenderedIds.size === 0;
            if (isFirstRender) {
                const msgs = [];
                snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
                msgs.sort((a, b) => (a.timestamp || '') > (b.timestamp || '') ? 1 : -1);
                box.innerHTML = '';
                _lastDateLabel = '';
                msgs.forEach(data => {
                    const lbl = fmtDateLabel(data.timestamp);
                    if (lbl !== _lastDateLabel) {
                        _lastDateLabel = lbl;
                        box.insertAdjacentHTML('beforeend', `<div class="kola-date-sep">${lbl}</div>`);
                    }
                    box.insertAdjacentHTML('beforeend', renderBubble(data, false));
                    _kolaChatRenderedIds.add(data.id);
                    if (data.sender === 'admin' && !data.read) {
                        try {
                            const { updateDoc, doc } = window._fs;
                            updateDoc(doc(db, 'supportChats', data.id), { read: true }).catch(()=>{});
                        } catch(e) {}
                    }
                });
                box.scrollTop = box.scrollHeight;
                return;
            }

            // Incremental update — only touch what actually changed.
            let appended = false;
            snap.docChanges().forEach(change => {
                const data = { id: change.doc.id, ...change.doc.data() };
                if (change.type === 'added' && !_kolaChatRenderedIds.has(data.id)) {
                    const lbl = fmtDateLabel(data.timestamp);
                    if (lbl !== _lastDateLabel) {
                        _lastDateLabel = lbl;
                        box.insertAdjacentHTML('beforeend', `<div class="kola-date-sep">${lbl}</div>`);
                    }
                    box.insertAdjacentHTML('beforeend', renderBubble(data, false));
                    _kolaChatRenderedIds.add(data.id);
                    appended = true;
                    if (data.sender === 'admin' && !data.read) {
                        try {
                            const { updateDoc, doc } = window._fs;
                            updateDoc(doc(db, 'supportChats', data.id), { read: true }).catch(()=>{});
                        } catch(e) {}
                    }
                } else if (change.type === 'removed') {
                    _kolaChatRenderedIds.delete(data.id);
                    const el = box.querySelector(`[data-msg-id="${data.id}"]`);
                    if (el) el.remove();
                } else if (change.type === 'modified' && _kolaChatRenderedIds.has(data.id)) {
                    // Reactions (and other in-place edits) land here — swap just that
                    // row's markup in place so a new ❤️ shows up live without a full
                    // re-render of the thread.
                    const el = box.querySelector(`[data-msg-id="${data.id}"]`);
                    if (el) el.outerHTML = renderBubble(data, false);
                }
            });
            if (appended) box.scrollTop = box.scrollHeight;
        }, (err) => {
            console.error('[KolaChat] Snapshot error:', err);
        });
    },

    async send() {
        const inp   = document.getElementById('kola-chat-input');
        const text  = (inp?.value || '').trim();
        const pendingImgs = window._kolaChatPendingImages || [];
        const hasImg = pendingImgs.length > 0;

        if (!text && !hasImg) { inp?.focus(); return; }

        if (!window._kolaDB || !window._fs) {
            alert('Still connecting… please try again in a moment.');
            return;
        }

        clearTimeout(_studentTypingTimer);
        _setTypingFlag(getUserId(), 'userTyping', false);

        inp.value = ''; inp.style.height = 'auto';
        { const box = document.getElementById('kola-chat-messages'); if (box) box.scrollTop = box.scrollHeight; }
        // Dismiss the keyboard right after sending — unless the admin has
        // turned this off site-wide (see settings/appConfig.autoCloseKeyboard).
        if (window._kolaAutoCloseKeyboard !== false) inp?.blur(); else inp?.focus();

        const uid   = getUserId();
        const uname = getUserName();
        const replyTo = kolaReply.consume('student');

        if (hasImg) {
            // Snapshot + release the pending images immediately so the composer is free
            // right away — uploading now runs in the background instead of blocking send.
            const filesToUpload = pendingImgs.slice();
            window._kolaChatPendingImages = [];
            window._kolaChatUploadCancelled = false;
            kolaChat._sendWithImages(filesToUpload, text, uid, uname, replyTo); // not awaited on purpose
            return;
        }

        // Text-only messages: fire-and-forget so nothing here runs after an `await`,
        // which is what was silently dismissing the mobile keyboard.
        kolaChat._sendTextOnly(text, uid, uname, replyTo, inp);
    },

    async _sendTextOnly(text, uid, uname, replyTo, inp) {
        try {
            const { collection, addDoc } = window._fs;
            await addDoc(collection(window._kolaDB, 'supportChats'), {
                userId: uid, userName: uname, userEmail: getSession().email || uid,
                sender: 'user', channel: _kolaChatChannel,
                text: text, images: [], imageUrl: '',
                replyTo: replyTo, timestamp: new Date().toISOString(), read: false
            });
        } catch(e) {
            console.error('[KolaChat] Send error:', e);
            if (inp) inp.value = text;
            alert('Could not send. Error: ' + e.message);
        }
    },

    /* Runs the image upload + Firestore write in the background, without ever
       disabling the composer — the user can keep typing/sending text meanwhile.
       Uploads run in parallel (not one-by-one) so multiple photos finish much faster. */
    async _sendWithImages(files, text, uid, uname, replyTo) {
        kolaChat._showUploadOverlay('kola-img-preview-grid', () => { window._kolaChatUploadCancelled = true; });
        const bar = document.getElementById('kola-img-preview-bar');
        if (bar) bar.style.display = 'flex';
        const statusEl = document.getElementById('kola-img-preview-status');
        let completed = 0;
        if (statusEl) statusEl.textContent = files.length > 1 ? `Uploading 0/${files.length}…` : 'Uploading…';
        let images;
        try {
            images = await Promise.all(files.map(f =>
                kolaChat._uploadToImgBB(f).then(url => {
                    completed++;
                    if (statusEl) statusEl.textContent = files.length > 1 ? `Uploading ${completed}/${files.length}…` : 'Uploading…';
                    return url;
                })
            ));
        } catch(uploadErr) {
            kolaChat._hideUploadOverlay('kola-img-preview-grid');
            if (bar) bar.style.display = 'none';
            const g = document.getElementById('kola-img-preview-grid'); if (g) g.innerHTML = '';
            alert('Image upload failed: ' + uploadErr.message);
            return;
        }
        if (window._kolaChatUploadCancelled) {
            kolaChat._hideUploadOverlay('kola-img-preview-grid');
            if (bar) bar.style.display = 'none';
            const g = document.getElementById('kola-img-preview-grid'); if (g) g.innerHTML = '';
            return;
        }
        kolaChat._hideUploadOverlay('kola-img-preview-grid');
        if (bar) bar.style.display = 'none';
        const g2 = document.getElementById('kola-img-preview-grid'); if (g2) g2.innerHTML = '';

        try {
            const { collection, addDoc } = window._fs;
            await addDoc(collection(window._kolaDB, 'supportChats'), {
                userId: uid, userName: uname, userEmail: getSession().email || uid,
                sender: 'user', channel: _kolaChatChannel,
                text: text, images: images, imageUrl: images[0] || '',
                replyTo: replyTo, timestamp: new Date().toISOString(), read: false
            });
        } catch(e) {
            console.error('[KolaChat] Send error:', e);
            alert('Could not send image message. Error: ' + e.message);
        }
    },

    /* ── ImgBB upload ── */
    async _uploadToImgBB(file) {
        const IMGBB_KEY = '6754d0321222e9f58c723a5081ecfc1f'; // free public key
        const compressed = await kolaCompressImageForUpload(file);
        const formData = new FormData();
        formData.append('image', compressed);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
            method: 'POST', body: formData
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error?.message || 'ImgBB upload failed');
        return json.data.url;
    },

    /* ── Document/file selected from file picker (PDF/DOC/PPT/ZIP/etc.) ──
       Uploaded via Cloudinary's "raw" resource type — same account/preset
       already used for voice notes and video stories. No Firebase Storage
       involved at all, so there are no Storage security rules to configure. */
    async onFileSelected(input) {
        const file = input.files?.[0];
        if (!file) return;
        input.value = '';

        if (file.size > 20 * 1024 * 1024) {
            alert('File must be under 20MB.');
            return;
        }

        const fab = document.getElementById('kola-chat-send-btn');
        if (fab) { fab.style.opacity = '0.5'; fab.style.pointerEvents = 'none'; }

        try {
            const CLOUD_NAME = 'dvaku16uu';
            const UPLOAD_PRESET = 'Kimi alok';
            const fd = new FormData();
            fd.append('file', file);
            fd.append('upload_preset', UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/raw/upload`, { method: 'POST', body: fd });
            if (!res.ok) { const err = await res.json().catch(()=>({})); throw new Error(err.error?.message || `Upload error ${res.status}`); }
            const json = await res.json();
            const fileUrl = json.secure_url;

            const { collection, addDoc } = window._fs;
            await addDoc(collection(window._kolaDB, 'supportChats'), {
                userId: getUserId(),
                userName: getUserName(),
                userEmail: getSession().email || getUserId(),
                sender: 'user',
                channel: _kolaChatChannel,
                text: '',
                fileUrl, fileName: file.name, fileSize: humanFileSize(file.size),
                timestamp: new Date().toISOString(),
                read: false
            });
        } catch(e) {
            console.error('[KolaChat] File send error:', e);
            let hint = '';
            if (/not allowed|disabled|blocked/i.test(e.message)) {
                hint = '\n\nThis usually means Cloudinary is blocking PDF/ZIP delivery by default for new accounts. Fix: Cloudinary Console → Settings → Security → enable "Allow delivery of PDF and ZIP files" (or similar wording), then Save.';
            }
            alert('Could not send file: ' + e.message + hint);
        } finally {
            if (fab) { fab.style.opacity = '1'; fab.style.pointerEvents = 'auto'; }
        }
    },

    /* ── Image(s) selected from file picker — multi-image sharing ── */
    onImageSelected(input) {
        const files = Array.from(input.files || []);
        if (!files.length) return;
        input.value = '';

        const allowed = ['image/jpeg','image/png','image/gif'];
        window._kolaChatPendingImages = window._kolaChatPendingImages || [];

        for (const file of files) {
            if (!allowed.includes(file.type)) { alert(`"${file.name}" skipped — only JPG, PNG and GIF images are allowed.`); continue; }
            if (file.size > 8 * 1024 * 1024) { alert(`"${file.name}" skipped — image must be under 8MB.`); continue; }
            if (window._kolaChatPendingImages.length >= 10) { alert('You can attach up to 10 images per message.'); break; }
            window._kolaChatPendingImages.push(file);
        }
        this._renderImagePreviewGrid('kola-img-preview-bar', 'kola-img-preview-grid', 'kola-img-preview-status', window._kolaChatPendingImages, 'kola-chat-img-input', () => kolaChat.clearImage());
    },

    /* Shared renderer for the multi-image preview grid (student + admin use the same shape).
       Mirrors the real WhatsApp grouped-photo layout: up to 4 tiles shown, "+N" badge on
       the last one if there are more, plus an always-available "add more" tile. */
    _renderImagePreviewGrid(barId, gridId, statusId, pendingArr, inputId, onClear) {
        const bar = document.getElementById(barId);
        const grid = document.getElementById(gridId);
        const status = document.getElementById(statusId);
        if (!bar || !grid) return;
        if (!pendingArr.length) { bar.style.display = 'none'; grid.innerHTML = ''; return; }
        bar.style.display = 'flex';
        if (status) status.textContent = pendingArr.length === 1 ? 'Ready to send' : `${pendingArr.length} photos ready to send`;
        grid.innerHTML = '';

        const shown = pendingArr.slice(0, 4);
        const extra = pendingArr.length - shown.length;
        shown.forEach((file, idx) => {
            const reader = new FileReader();
            reader.onload = e => {
                const item = document.createElement('div');
                item.className = 'kip-item';
                const isLast = idx === shown.length - 1 && extra > 0;
                item.innerHTML = `<img src="${e.target.result}" alt="">
                    <button class="kip-remove" type="button"><i class="fa-solid fa-xmark"></i></button>
                    ${isLast ? `<div class="kip-more-badge">+${extra}</div>` : ''}`;
                item.querySelector('.kip-remove').onclick = () => {
                    const i = pendingArr.indexOf(file);
                    if (i > -1) pendingArr.splice(i, 1);
                    kolaChat._renderImagePreviewGrid(barId, gridId, statusId, pendingArr, inputId, onClear);
                };
                grid.appendChild(item);
            };
            reader.readAsDataURL(file);
        });
        if (pendingArr.length < 10) {
            const addBtn = document.createElement('div');
            addBtn.className = 'kip-add';
            addBtn.innerHTML = '<i class="fa-solid fa-plus"></i>';
            addBtn.onclick = () => document.getElementById(inputId)?.click();
            grid.appendChild(addBtn);
        }
    },

    /* Shows the spinning progress ring + cancel (X) button over the preview grid while
       images upload — same visual language as WhatsApp's own "sending" state. */
    _showUploadOverlay(gridId, onCancel) {
        const grid = document.getElementById(gridId);
        if (!grid) return;
        this._hideUploadOverlay(gridId);
        const overlay = document.createElement('div');
        overlay.className = 'kola-upload-overlay';
        overlay.id = gridId + '-upload-overlay';
        overlay.innerHTML = `<div class="kola-upload-ring"><button class="kola-upload-cancel" title="Cancel"><i class="fa-solid fa-xmark"></i></button></div>`;
        overlay.querySelector('.kola-upload-cancel').onclick = onCancel;
        grid.appendChild(overlay);
    },
    _hideUploadOverlay(gridId) {
        document.getElementById(gridId + '-upload-overlay')?.remove();
    },

    /* ── Clear selected image(s) ── */
    clearImage() {
        window._kolaChatPendingImages = [];
        window._kolaChatUploadCancelled = false;
        this._hideUploadOverlay('kola-img-preview-grid');
        const bar = document.getElementById('kola-img-preview-bar');
        if (bar) bar.style.display = 'none';
        const grid = document.getElementById('kola-img-preview-grid');
        if (grid) grid.innerHTML = '';
        const inp = document.getElementById('kola-chat-img-input');
        if (inp) inp.value = '';
    },

    /* ── Full-screen image viewer — supports a single image OR a full
       gallery: swipe / arrow-click through every image in the message,
       with a counter and a working download button for whichever image
       is currently on screen. ── */
    openImageViewer(images, startIndex) {
        // Back-compat: still accept a single URL string like before.
        const list = Array.isArray(images) ? images.filter(Boolean) : [images];
        if (!list.length) return;
        let idx = Math.min(Math.max(startIndex || 0, 0), list.length - 1);

        let overlay = document.getElementById('kola-img-viewer-overlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'kola-img-viewer-overlay';
            overlay.style.cssText = 'position:fixed;inset:0;z-index:30000;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;padding:16px;touch-action:pan-y;';
            overlay.innerHTML = `
                <button onclick="kolaChat.closeImageViewer()"
                    style="position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div id="kola-img-viewer-counter"
                    style="position:absolute;top:24px;left:16px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:12px;font-weight:800;padding:6px 12px;border-radius:100px;z-index:2;display:none;"></div>
                <button id="kola-img-viewer-prev" onclick="kolaChat._ivStep(-1)"
                    style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:2;">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button id="kola-img-viewer-next" onclick="kolaChat._ivStep(1)"
                    style="position:absolute;right:12px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:2;">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <img id="kola-img-viewer-img" src="" alt="Image"
                    style="max-width:100%;max-height:90vh;border-radius:12px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,0.8);user-select:none;-webkit-user-drag:none;">
                <a id="kola-img-viewer-dl" href="" download target="_blank"
                    style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;font-weight:900;font-size:12px;padding:10px 22px;border-radius:100px;text-decoration:none;display:flex;align-items:center;gap:8px;z-index:2;">
                    <i class="fa-solid fa-download"></i> Download
                </a>`;
            overlay.addEventListener('click', e => { if (e.target === overlay) kolaChat.closeImageViewer(); });

            // Swipe left / right to move through the gallery on touch devices.
            let touchStartX = 0, touchStartY = 0;
            overlay.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });
            overlay.addEventListener('touchend', e => {
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
                    kolaChat._ivStep(dx < 0 ? 1 : -1);
                }
            }, { passive: true });

            document.body.appendChild(overlay);
        }

        overlay._ivList = list;
        overlay._ivIndex = idx;
        kolaChat._ivRender();
        overlay.style.display = 'flex';
    },
    _ivRender() {
        const overlay = document.getElementById('kola-img-viewer-overlay');
        if (!overlay) return;
        const list = overlay._ivList || [];
        const idx = overlay._ivIndex || 0;
        const url = list[idx];
        document.getElementById('kola-img-viewer-img').src = url;
        document.getElementById('kola-img-viewer-dl').href = url;
        const counter = document.getElementById('kola-img-viewer-counter');
        const prevBtn = document.getElementById('kola-img-viewer-prev');
        const nextBtn = document.getElementById('kola-img-viewer-next');
        const multi = list.length > 1;
        if (counter) { counter.style.display = multi ? 'block' : 'none'; counter.textContent = `${idx + 1} / ${list.length}`; }
        if (prevBtn) prevBtn.style.display = multi ? 'flex' : 'none';
        if (nextBtn) nextBtn.style.display = multi ? 'flex' : 'none';
    },
    _ivStep(dir) {
        const overlay = document.getElementById('kola-img-viewer-overlay');
        if (!overlay || !overlay._ivList) return;
        const len = overlay._ivList.length;
        overlay._ivIndex = (overlay._ivIndex + dir + len) % len;
        kolaChat._ivRender();
    },
    closeImageViewer() {
        const overlay = document.getElementById('kola-img-viewer-overlay');
        if (overlay) overlay.style.display = 'none';
    }
};

/* ── Check for unread admin replies (for FAB badge + browser notification) ── */
let _notifiedMsgIds = new Set(); // prevents re-notifying for the same message across snapshot re-fires
function checkUnreadBadge() {
    waitForFirebase(() => {
        const { collection, query, where, onSnapshot } = window._fs;
        const db  = window._kolaDB;
        const uid = getUserId();
        const lastSeen = parseInt(localStorage.getItem('kolaChat_lastSeen') || '0');
        const q = query(
            collection(db, 'supportChats'),
            where('userId', '==', uid),
            where('sender', '==', 'admin'),
            where('read', '==', false)
        );
        onSnapshot(q, (snap) => {
            const badge = document.getElementById('kola-fab-badge');
            const chatOpen = document.getElementById('kola-chat-screen')?.classList.contains('open');

            // Fire a system notification for each newly-arrived unread reply —
            // only when the chat isn't already open (person is already looking at it)
            // and only once per message id (docChanges can re-fire on read-state updates).
            if (!chatOpen && 'Notification' in window && Notification.permission === 'granted') {
                snap.docChanges().forEach(change => {
                    if (change.type === 'added' && !_notifiedMsgIds.has(change.doc.id)) {
                        _notifiedMsgIds.add(change.doc.id);
                        const data = change.doc.data();
                        const isKhufia = data.channel === 'khufia';
                        try {
                            const n = new Notification(isKhufia ? '🕵️ New reply from Khufia Agent' : '💬 New reply from Kola Bro', {
                                body: (data.text || 'You have a new message').slice(0, 120),
                                icon: isKhufia ? undefined : 'https://drive.google.com/thumbnail?id=1X_k6gMNuOkHk-GM5o8LDzIdNJUPEIM26&sz=w200',
                                tag: 'kola-chat-' + change.doc.id // avoids stacking duplicate OS notifications
                            });

window.adminChat = {

    open(userId, userName, userEmail) {

        const modal = document.getElementById('admin-chat-modal');
        if (modal) modal.classList.remove('open');
        document.body.style.overflow = '';
        if (_adminChatUnsub) { _adminChatUnsub(); _adminChatUnsub = null; }
        if (_acmTypingUnsub) { _acmTypingUnsub(); _acmTypingUnsub = null; }
        clearTimeout(_adminTypingTimer);
        if (_adminCurrentUser) _setTypingFlag(_adminCurrentUser.userId + '__' + _adminChatChannel, 'adminTyping', false);
        _adminChatRenderedIds.clear();
        // Refresh admin list with fresh data (a reply may have just been sent)
        if (window.loadAdminDevChats) window.loadAdminDevChats();
    },

    // Listens for the student typing a message on THIS channel, and shows/hides the
    // "Student typing…" bubble above the admin's message list in real time.
    _listenTyping(userId) {
        if (_acmTypingUnsub) _acmTypingUnsub();
        const { doc, onSnapshot } = window._fs;
        const typingId = userId + '__' + _adminChatChannel;
        _acmTypingUnsub = onSnapshot(doc(window._kolaDB, 'typingStatus', typingId), (snap) => {
            const el = document.getElementById('acm-typing');
            if (!el) return;
            const data = snap.exists() ? snap.data() : null;
            const isTyping = !!(data && data.userTyping && (Date.now() - (data.userTypingAt || 0)) < TYPING_STALE_MS);
            el.style.display = isTyping ? 'block' : 'none';
            if (isTyping) {
                const box = document.getElementById('acm-messages');
                if (box) box.scrollTop = box.scrollHeight;
            }
        }, () => {});
    },

    _listen(userId) {
        if (_adminChatUnsub) _adminChatUnsub();
        _adminChatRenderedIds.clear();
        const { collection, query, where, onSnapshot, limit } = window._fs;
        const db = window._kolaDB;
        let lastDate = '';

        // Equality-only filters (userId + channel) — no composite index required,
        // and this keeps Developer / Khufia Agent conversations from ever mixing.
        const q = query(
            collection(db, 'supportChats'),
            where('userId', '==', userId),
            where('channel', '==', _adminChatChannel),
            limit(300)
        );

        _adminChatUnsub = onSnapshot(q, (snap) => {
            const box = document.getElementById('acm-messages');
            if (!box) return;

            if (snap.empty) {
                box.innerHTML = `<div style="text-align:center;padding:40px;color:#CCCCCC;font-size:13px;"><div style="font-size:40px;margin-bottom:12px;">💬</div>No messages yet.</div>`;
                _adminChatRenderedIds.clear();
                return;
            }

            const isFirstRender = _adminChatRenderedIds.size === 0;
            if (isFirstRender) {
                const msgs = [];
                snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
                msgs.sort((a, b) => (a.timestamp || '') > (b.timestamp || '') ? 1 : -1);
                box.innerHTML = '';
                lastDate = '';
                msgs.forEach(data => {
                    const lbl = fmtDateLabel(data.timestamp);
                    if (lbl !== lastDate) {
                        lastDate = lbl;
                        box.insertAdjacentHTML('beforeend', `<div class="kola-date-sep">${lbl}</div>`);
                    }
                    box.insertAdjacentHTML('beforeend', renderBubble(data, true));
                    _adminChatRenderedIds.add(data.id);
                    if (data.sender === 'user' && !data.read) {
                        try {
                            const { updateDoc, doc } = window._fs;
                            updateDoc(doc(db, 'supportChats', data.id), { read: true }).catch(()=>{});
                        } catch(e) {}
                    }
                });
                box.scrollTop = box.scrollHeight;
                return;
            }

            let appended = false;
            snap.docChanges().forEach(change => {
                const data = { id: change.doc.id, ...change.doc.data() };
                if (change.type === 'added' && !_adminChatRenderedIds.has(data.id)) {
                    const lbl = fmtDateLabel(data.timestamp);
                    if (lbl !== lastDate) {
                        lastDate = lbl;
                        box.insertAdjacentHTML('beforeend', `<div class="kola-date-sep">${lbl}</div>`);
                    }
                    box.insertAdjacentHTML('beforeend', renderBubble(data, true));
                    _adminChatRenderedIds.add(data.id);
                    appended = true;
                    if (data.sender === 'user' && !data.read) {
                        try {
                            const { updateDoc, doc } = window._fs;
                            updateDoc(doc(db, 'supportChats', data.id), { read: true }).catch(()=>{});
                        } catch(e) {}
                    }
                } else if (change.type === 'removed') {
                    _adminChatRenderedIds.delete(data.id);
                    const el = box.querySelector(`[data-msg-id="${data.id}"]`);
                    if (el) el.remove();
                } else if (change.type === 'modified' && _adminChatRenderedIds.has(data.id)) {
                    const el = box.querySelector(`[data-msg-id="${data.id}"]`);
                    if (el) el.outerHTML = renderBubble(data, true);
                }
            });
            if (appended) box.scrollTop = box.scrollHeight;
        });
    },

    async send() {
        const inp  = document.getElementById('acm-input');
        const text = (inp?.value || '').trim();
        const pendingImgs = window._acmPendingImages || [];
        const hasImg = pendingImgs.length > 0;
        if ((!text && !hasImg) || !_adminCurrentUser) return;
        if (!window._kolaDB || !window._fs) { alert('Still connecting…'); return; }
        inp.value = ''; inp.style.height = 'auto';
        { const box = document.getElementById('acm-messages'); if (box) box.scrollTop = box.scrollHeight; }
        // Dismiss the keyboard right after sending — unless the admin has
        // turned this off site-wide (see settings/appConfig.autoCloseKeyboard).
        if (window._kolaAutoCloseKeyboard !== false) inp?.blur(); else inp?.focus();

        clearTimeout(_adminTypingTimer);
        _setTypingFlag(_adminCurrentUser.userId + '__' + _adminChatChannel, 'adminTyping', false);

        const targetUser = _adminCurrentUser;   // snapshot — admin might switch chats while this uploads
        const channel = _adminChatChannel;
        const replyTo = kolaReply.consume('admin');

        if (hasImg) {
            // Snapshot + release pending images immediately so the composer stays free —
            // upload runs in the background instead of blocking further messages.
            const filesToUpload = pendingImgs.slice();
            window._acmPendingImages = [];
            window._acmUploadCancelled = false;
            adminChat._sendWithImages(filesToUpload, text, targetUser, channel, replyTo); // not awaited
            return;
        }

        // Fire-and-forget, same reason as the student side: nothing here should run
        // after an `await`, since that's what breaks the mobile keyboard staying open.
        adminChat._sendTextOnly(text, targetUser, channel, replyTo);
    },

    async _sendTextOnly(text, targetUser, channel, replyTo) {
        try {
            const { collection, addDoc } = window._fs;
            await addDoc(collection(window._kolaDB, 'supportChats'), {
                userId: targetUser.userId, userName: targetUser.userName, userEmail: targetUser.userEmail,
                sender: 'admin', channel: channel,
                text: text, images: [], imageUrl: '',
                replyTo: replyTo, timestamp: new Date().toISOString(), read: false
            });
        } catch(e) { alert('Send failed: ' + e.message); }
    },

    /* Background image upload + send for the admin composer — mirrors kolaChat._sendWithImages
       so the admin can keep replying to text while photos are still uploading.
       Uploads run in parallel for speed, same as the student side. */
    async _sendWithImages(files, text, targetUser, channel, replyTo) {
        window.kolaChat._showUploadOverlay('acm-img-preview-grid', () => { window._acmUploadCancelled = true; });
        const bar = document.getElementById('acm-img-preview-bar');
        if (bar) bar.style.display = 'flex';
        const statusEl = document.getElementById('acm-img-preview-status');
        const IMGBB_KEY = '6754d0321222e9f58c723a5081ecfc1f';
        let completed = 0;
        if (statusEl) statusEl.textContent = files.length > 1 ? `Uploading 0/${files.length}…` : 'Uploading…';
        const uploadOne = async (file) => {
            const compressed = await kolaCompressImageForUpload(file);
            const fd = new FormData(); fd.append('image', compressed);
            const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:'POST', body:fd });
            const j = await r.json();
            if (!j.success) throw new Error(j.error?.message || 'Upload failed');
            completed++;
            if (statusEl) statusEl.textContent = files.length > 1 ? `Uploading ${completed}/${files.length}…` : 'Uploading…';
            return j.data.url;
        };
        let images;
        try {
            images = await Promise.all(files.map(uploadOne));
        } catch(ue) {
            window.kolaChat._hideUploadOverlay('acm-img-preview-grid');
            if (bar) bar.style.display = 'none';
            const g = document.getElementById('acm-img-preview-grid'); if (g) g.innerHTML = '';
            alert('Image upload failed: ' + ue.message);
            return;
        }
        if (window._acmUploadCancelled) {
            window.kolaChat._hideUploadOverlay('acm-img-preview-grid');
            if (bar) bar.style.display = 'none';
            const g = document.getElementById('acm-img-preview-grid'); if (g) g.innerHTML = '';
            return;
        }
        window.kolaChat._hideUploadOverlay('acm-img-preview-grid');
        if (bar) bar.style.display = 'none';
        const g2 = document.getElementById('acm-img-preview-grid'); if (g2) g2.innerHTML = '';

        try {
            const { collection, addDoc } = window._fs;
            await addDoc(collection(window._kolaDB, 'supportChats'), {
                userId: targetUser.userId, userName: targetUser.userName, userEmail: targetUser.userEmail,
                sender: 'admin', channel: channel,
                text: text, images: images, imageUrl: images[0] || '',
                replyTo: replyTo, timestamp: new Date().toISOString(), read: false
            });
        } catch(e) { alert('Send failed: ' + e.message); }
    },

    /* ── Admin: send a document/file to the currently open student chat ── */
    async onFileSelected(input) {
        const file = input.files?.[0];
        if (!file) return;
        input.value = '';

        if (file.size > 20 * 1024 * 1024) {

            fd.append('file', file);
            fd.append('upload_preset', UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/raw/upload`, { method: 'POST', body: fd });
            if (!res.ok) { const err = await res.json().catch(()=>({})); throw new Error(err.error?.message || `Upload error ${res.status}`); }
            const json = await res.json();
            const fileUrl = json.secure_url;

            const { collection, addDoc } = window._fs;
            await addDoc(collection(window._kolaDB, 'supportChats'), {
                userId: _adminCurrentUser.userId,
                userName: _adminCurrentUser.userName,
                userEmail: _adminCurrentUser.userEmail,
                sender: 'admin',
                channel: _adminChatChannel,
                text: '',
                fileUrl, fileName: file.name, fileSize: humanFileSize(file.size),
                timestamp: new Date().toISOString(),
                read: false
            });
        } catch(e) {
            let hint = '';
            if (/not allowed|disabled|blocked/i.test(e.message)) {
                hint = '\n\nCloudinary is likely blocking PDF/ZIP delivery by default. Fix: Cloudinary Console → Settings → Security → enable "Allow delivery of PDF and ZIP files".';
            }
            alert('Could not send file: ' + e.message + hint);

    /* ── Image(s) selected from file picker — multi-image sharing (admin side) ── */
    onImageSelected(input) {
        const files = Array.from(input.files || []);
        if (!files.length) return;
        input.value = '';

        const allowed = ['image/jpeg','image/png','image/gif'];
        window._acmPendingImages = window._acmPendingImages || [];

        for (const file of files) {
            if (!allowed.includes(file.type)) { alert(`"${file.name}" skipped — only JPG, PNG and GIF images are allowed.`); continue; }
            if (file.size > 8 * 1024 * 1024) { alert(`"${file.name}" skipped — image must be under 8MB.`); continue; }
            if (window._acmPendingImages.length >= 10) { alert('You can attach up to 10 images per message.'); break; }
            window._acmPendingImages.push(file);

        window.kolaChat._renderImagePreviewGrid('acm-img-preview-bar', 'acm-img-preview-grid', 'acm-img-preview-status', window._acmPendingImages, 'acm-img-input', () => adminChat.clearImage());

/* ════════════════════════════════════
   ADMIN CHAT LIST — now a LIVE listener instead of a one-time cached fetch.
   Previously this used getDocs() behind a 60s cache, which is why it could
   feel slow ("stuck loading") on the first hit of every 60s window, and why
   new student messages / replies wouldn't show up until the cache expired
   or the refresh icon was tapped. Switching to onSnapshot means the list
   loads once and then stays instantly up to date on its own.
════════════════════════════════════ */
let _adminDevChatsUnsub = null;

function _renderAdminDevChatsList(docs) {
    const list = document.getElementById('admin-devchats-list');
    if (!list) return;

    const byUser = {};
    docs.forEach(d => {
        const data = d.data();
        const key  = data.userId;
        if (!byUser[key]) {
            byUser[key] = {
                userId:    key,
                userName:  data.userName || 'Student',
                userEmail: data.userEmail || key,
                msgs:      []
            };
        }
        // We only need the latest message + unread count for the list view,
        // so cap how many raw docs we keep per user instead of holding
        // every message in memory (full history still loads lazily
        // per-conversation in adminChat.open, unaffected by this).
        if (byUser[key].msgs.length < 50) byUser[key].msgs.push({ id: d.id, ...data });
    });

    const users = Object.values(byUser).sort((a,b) => {
        const ta = a.msgs[0]?.timestamp || '';
        const tb = b.msgs[0]?.timestamp || '';
        return tb > ta ? 1 : -1;
    });

    if (!users.length) {
        list.innerHTML = `<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.2);font-size:13px;">
            <i class="fa-solid fa-comments" style="font-size:32px;display:block;margin-bottom:12px;"></i>No messages yet.</div>`;
        return;
    }

    list.innerHTML = users.map(u => {
        const last   = u.msgs[0];
        const time   = fmtTime(last?.timestamp);
        const unread = u.msgs.filter(m => m.sender === 'user' && !m.read).length;
        let preview = (last?.text || '(no message)').slice(0, 50) + ((last?.text||'').length > 50 ? '…' : '');
        const safeN = (u.userName||'').replace(/'/g,"\\'");
        const safeE = (u.userEmail||'').replace(/'/g,"\\'");
        const safeI = (u.userId||'').replace(/'/g,"\\'");
        return `<div onclick="adminChat.open('${safeI}','${safeN}','${safeE}')"
            style="display:flex;align-items:center;gap:12px;padding:13px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:14px;cursor:pointer;transition:0.2s;margin-bottom:6px;"
            onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='rgba(255,255,255,0.03)'">
            <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#FFFFFF,#CCCCCC);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#000000;flex-shrink:0;position:relative;">
                ${(u.userName||'?').charAt(0).toUpperCase()}
                ${unread ? `<div style="position:absolute;top:-3px;right:-3px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #000000;">${unread}</div>` : ''}
            </div>
            <div style="flex:1;min-width:0;">
                <div style="font-weight:800;font-size:14px;color:#FFFFFF;">${esc(u.userName)}</div>
                <div style="font-size:11px;color:${last?.sender==='admin'?'#333333':'#555'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                    ${last?.sender==='admin' ? '↪ You: ' : ''}${esc(preview)}
                </div>
            </div>
            <div style="text-align:right;flex-shrink:0;">
                <div style="font-size:10px;color:#CCCCCC;margin-bottom:3px;">${time}</div>
                <div style="font-size:9px;color:#CCCCCC;overflow:hidden;text-overflow:ellipsis;max-width:80px;">${esc(u.userEmail||'')}</div>
            </div>
        </div>`;
    }).join('');
}

window.loadAdminDevChats = async function(fullHistory) {
    const list = document.getElementById('admin-devchats-list');
    const statusEl = document.getElementById('admin-devchats-status');
    if (!list) return;
    list.innerHTML = `<div style="text-align:center;padding:30px;color:rgba(255,255,255,0.2);">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:24px;color:#FFFFFF;display:block;margin-bottom:10px;"></i>Loading…</div>`;

    // Always drop any previous live subscription before starting a new one —
    // otherwise re-opening this panel repeatedly would stack up listeners.
    if (_adminDevChatsUnsub) { _adminDevChatsUnsub(); _adminDevChatsUnsub = null; }
    if (!_adminChatChannel) return; // no channel unlocked yet — nothing to load

    try {
        // Give Firebase up to 10s to be ready (was 6s) — on a slow connection
        // 6s wasn't always enough, which is what caused the "sometimes it just
        // doesn't load" symptom.
        let tries = 0;
        while ((!window._kolaDB || !window._fs) && tries++ < 50) await new Promise(r => setTimeout(r, 200));
        if (!window._kolaDB || !window._fs) throw new Error('Could not connect — check your internet connection and try again.');

        const { collection, getDocs, onSnapshot, query, orderBy, where } = window._fs;

        if (fullHistory) {
            // Explicit "load full history" action — one-time fetch is fine here,
            // this isn't meant to stay live, just to search further back.
            if (statusEl) statusEl.style.display = 'none';
            const q = query(collection(window._kolaDB, 'supportChats'), orderBy('timestamp', 'desc'));
            const snap = await getDocs(q);
            const docs = []; snap.forEach(d => { if (d.data().channel === _adminChatChannel) docs.push(d); });
            _renderAdminDevChatsList(docs);
        } else {
            // LIVE view, filtered to the unlocked channel only (Developer vs Khufia
            // Agent never mix). A single equality filter needs no composite index,
            // so this can't get stuck the way the old time-windowed query could.
            if (statusEl) statusEl.style.display = 'block';
            const q = query(
                collection(window._kolaDB, 'supportChats'),
                where('channel', '==', _adminChatChannel)
            );
            _adminDevChatsUnsub = onSnapshot(q, (snap) => {
                const docs = []; snap.forEach(d => docs.push(d));
                _renderAdminDevChatsList(docs);
            }, (err) => {
                list.innerHTML = `<div style="text-align:center;padding:30px;color:#f87171;font-size:13px;">${err.message}</div>`;
            });
        }

    } catch(e) {
        list.innerHTML = `<div style="text-align:center;padding:30px;color:#f87171;font-size:13px;">${e.message}</div>`;
    }
};

window.kolaVoice = (function() {

    let _playingAudio = null;

    function getTimerEl()  { return _context === 'admin' ? document.getElementById('acm-rec-timer')          : document.getElementById('kola-rec-timer'); }
    function getRecBar()   { return _context === 'admin' ? document.getElementById('acm-voice-recording-bar'): document.getElementById('kola-voice-recording-bar'); }
    function getInputBar() { return _context === 'admin' ? document.getElementById('acm-inputbar')           : document.getElementById('kola-chat-inputbar'); }
    function getImgBar()   { return _context === 'admin' ? document.getElementById('acm-img-preview-bar')    : document.getElementById('kola-img-preview-bar'); }

    return {

        async start(ctx) {
            _context = ctx || 'student';
            if (!navigator.mediaDevices?.getUserMedia) {
                alert('Voice messages are not supported on this browser.'); return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                _chunks = []; _secs = 0; _startedAt = Date.now();

                const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
                               : MediaRecorder.isTypeSupported('audio/webm')             ? 'audio/webm'
                               : 'audio/ogg';

                _recorder = new MediaRecorder(stream, { mimeType });
                _recorder.ondataavailable = e => { if (e.data.size > 0) _chunks.push(e.data); };
                _recorder.start(100);

                // Hide image preview bar if open, hide input bar, show recording bar
                const imgBar   = getImgBar();
                const recBar   = getRecBar();
                const inputBar = getInputBar();
                if (imgBar)   imgBar.style.display   = 'none';
                if (recBar)   recBar.style.display   = 'flex';
                if (inputBar) inputBar.style.display = 'none';

                // Start timer
                const timerEl = getTimerEl();
                _timerInt = setInterval(() => {
                    _secs++;
                    const m = Math.floor(_secs / 60);
                    const s = String(_secs % 60).padStart(2,'0');
                    if (timerEl) timerEl.textContent = m + ':' + s;
                    if (_secs >= 300) this.stop(); // auto-stop at 5 min
                }, 1000);

            } catch(e) {
                alert('Microphone access denied. Please allow microphone permission and try again.');
                console.error(e);
            }
        },

        cancel() {
            if (_recorder && _recorder.state !== 'inactive') {
                _recorder.stream.getTracks().forEach(t => t.stop());
                _recorder.stop();
            }
            _recorder = null; _chunks = [];
            clearInterval(_timerInt);
            const recBar   = getRecBar();
            const inputBar = getInputBar();
            if (recBar)   recBar.style.display  = 'none';
            if (inputBar) inputBar.style.display = 'flex';
        },

        stop() {
            if (!_recorder || _recorder.state === 'inactive') return;
            const duration = Math.max(1, Math.round((Date.now() - _startedAt) / 1000));
            clearInterval(_timerInt);

            _recorder.onstop = async () => {
                const recBar   = getRecBar();
                const inputBar = getInputBar();
                if (recBar)   recBar.style.display  = 'none';
                if (inputBar) inputBar.style.display = 'flex';

                const mimeType = _chunks[0]?.type || 'audio/webm';
                const blob = new Blob(_chunks, { type: mimeType });
                _chunks = [];

                if (blob.size < 500) return; // too short, ignore

                // Show uploading toast
                const toast = _showToast('⬆️ Uploading voice message…', '#FFFFFF');

                try {
                    await this._uploadToCloudinary(blob, mimeType, duration);
                    toast.remove();
                } catch(e) {
                    toast.remove();
                    _showToast('❌ Voice upload failed: ' + e.message, '#ef4444', 4000);
                    console.error('[KolaVoice] Upload error:', e);
                }
            };

            _recorder.stream.getTracks().forEach(t => t.stop());
            _recorder.stop();
            _recorder = null;
        },

        /* ── Upload blob to Cloudinary ── */
        async _uploadToCloudinary(blob, mimeType, duration) {
            if (CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUD_NAME') {
                throw new Error('Please set your Cloudinary Cloud Name and Upload Preset in the code.');
            }

            const ext = mimeType.includes('ogg') ? 'ogg' : 'webm';
            const fileName = `voice_${Date.now()}.${ext}`;

            const formData = new FormData();
            formData.append('file', blob, fileName);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            formData.append('resource_type', 'video'); // Cloudinary uses 'video' for audio too
            formData.append('folder', 'kolabro_voice');

            const res = await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`,
                { method: 'POST', body: formData }
            );

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error?.message || `Cloudinary error ${res.status}`);
            }

            const json = await res.json();
            const voiceUrl = json.secure_url;

            if (!voiceUrl) throw new Error('No URL returned from Cloudinary');

            // Save to Firestore
            await this._saveToFirestore(voiceUrl, duration);
        },

        /* ── Save voice message record to Firestore ── */
        async _saveToFirestore(voiceUrl, duration) {
            // Wait for Firestore
            let tries = 0;
            while ((!window._kolaDB || !window._fs) && tries++ < 30) await new Promise(r => setTimeout(r, 200));
            if (!window._kolaDB || !window._fs) throw new Error('Firebase not ready');

            const { collection, addDoc } = window._fs;
            const db = window._kolaDB;

            if (_context === 'admin') {
                const cu = window._adminCurrentUserRef;
                if (!cu) throw new Error('No active student chat');
                await addDoc(collection(db, 'supportChats'), {
                    userId:        cu.userId,
                    userName:      cu.userName, // the student's own name, kept consistent in the admin list
                    userEmail:     cu.userEmail,
                    sender:        'admin',
                    channel:       window._adminChatChannelRef,
                    text:          '',
                    voiceUrl:      voiceUrl,
                    voiceDuration: duration,
                    timestamp:     new Date().toISOString(),
                    read:          false
                });
            } else {
                const uid   = window.getUserId   ? getUserId()   : 'guest';
                const uname = window.getUserName ? getUserName() : 'Student';
                await addDoc(collection(db, 'supportChats'), {
                    userId:        uid,
                    userName:      uname,
                    userEmail:     getSession?.().email || uid,
                    sender:        'user',
                    channel:       window._kolaChatChannelRef,
                    text:          '',
                    voiceUrl:      voiceUrl,
                    voiceDuration: duration,
                    timestamp:     new Date().toISOString(),
                    read:          false
                });
            }
        },

        /* ── Play / pause a voice message ── */
        playMessage(url, uid, btn) {
            // Stop any currently playing audio
            if (_playingAudio) {
                _playingAudio.pause();
                _playingAudio = null;
                document.querySelectorAll('.kola-voice-play i').forEach(i => i.className = 'fa-solid fa-play');
            }

            const audio = new Audio(url);
            audio.crossOrigin = 'anonymous';
            _playingAudio = audio;

            const icon = btn.querySelector('i');
            icon.className = 'fa-solid fa-pause';

            audio.play().catch(e => {
                icon.className = 'fa-solid fa-play';
                alert('Could not play voice message: ' + e.message);
            });

            audio.onended = () => {
                icon.className  = 'fa-solid fa-play';
                _playingAudio   = null;
                // Restore original onclick
                btn.onclick = () => kolaVoice.playMessage(url, uid, btn);
            };

            // Toggle on click while playing
            btn.onclick = () => {
                if (!audio.paused) {
                    audio.pause();
                    icon.className = 'fa-solid fa-play';
                } else {
                    audio.play();
                    icon.className = 'fa-solid fa-pause';
                }
            };
        }
    };

    /* ── Small toast helper ── */
    function _showToast(msg, color, ms) {
        const t = document.createElement('div');
        t.textContent = msg;
        Object.assign(t.style, {
            position:'fixed', bottom:'90px', left:'50%', transform:'translateX(-50%)',
            background: color || '#FFFFFF', color:'#fff',
            padding:'10px 20px', borderRadius:'12px',
            fontSize:'13px', fontWeight:'700', zIndex:'30000',
            boxShadow:'0 4px 20px rgba(0,0,0,0.5)',
            whiteSpace:'nowrap', transition:'opacity 0.4s'
        });
        document.body.appendChild(t);
        if (ms) setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, ms);
        return t;
    }

})();

// Expose _adminCurrentUser ref for voice module
Object.defineProperty(window, '_adminCurrentUserRef', {
    get() { return typeof _adminCurrentUser !== 'undefined' ? _adminCurrentUser : null; },
    configurable: true
});

// Expose the student's chosen channel ('developer'/'khufia') for the voice module
Object.defineProperty(window, '_kolaChatChannelRef', {
    get() { return typeof _kolaChatChannel !== 'undefined' ? _kolaChatChannel : 'developer'; },
    configurable: true
});

  <script>
    // State management
    let editor = null;
    let currentTheme = 'dark';
    let activeFile = 'index.html';
    let files = {
      'index.html': { name: 'index.html', lang: 'html', content: '<h1>Hello World</h1>\n<button onclick="sayHello()">Click Me</button>' },
      'styles.css': { name: 'styles.css', lang: 'css', content: 'body {\n  font-family: sans-serif;\n  padding: 20px;\n}\nh1 {\n  color: #007acc;\n}' },
      'script.js': { name: 'script.js', lang: 'javascript', content: 'function sayHello() {\n  console.log("Hello from Coding Express Console!");\n  alert("Hello World!");\n}' }
    };

    // Initialize Monaco Editor
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' } });

    function initMonaco() {
      require(['vs/editor/editor.main'], function () {
        editor = monaco.editor.create(document.getElementById('monaco-editor-container'), {
          value: files[activeFile].content,
          language: files[activeFile].lang,
          theme: 'vs-dark',
          automaticLayout: true,
          suggestOnTriggerCharacters: true,
          quickSuggestions: true
        });

        // Update preview on code change
        editor.onDidChangeModelContent(() => {
          files[activeFile].content = editor.getValue();
          updateLivePreview();
        });
      });
    }

    // Modal & Workspace Actions
    function openLangPicker() {
      document.getElementById('lang-modal').style.display = 'flex';
    }

    function startWorkspace(mode) {
      document.getElementById('lang-modal').style.display = 'none';
      document.getElementById('landing-screen').style.display = 'none';
      document.getElementById('workspace').style.display = 'flex';

      setupFileSidebar(mode);
      initMonaco();
      setTimeout(updateLivePreview, 500);
    }

    function setupFileSidebar(mode) {
      const fileList = document.getElementById('file-list');
      fileList.innerHTML = '';

      let availableFiles = [];
      if (mode === 'html') availableFiles = ['index.html'];
      else if (mode === 'css') availableFiles = ['styles.css'];
      else if (mode === 'js') availableFiles = ['script.js'];
      else availableFiles = ['index.html', 'styles.css', 'script.js'];

      availableFiles.forEach((fileKey) => {
        const li = document.createElement('li');
        li.className = `file-item ${fileKey === activeFile ? 'active' : ''}`;
        li.innerHTML = `<i class="fa-regular fa-file-code"></i> ${fileKey}`;
        li.onclick = () => switchFile(fileKey, li);
        fileList.appendChild(li);
      });

      if (!availableFiles.includes(activeFile)) {
        activeFile = availableFiles[0];
      }
      document.getElementById('current-filename').innerText = activeFile;
    }

    function switchFile(fileKey, element) {
      if (!editor) return;
      document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      activeFile = fileKey;
      document.getElementById('current-filename').innerText = fileKey;

      const model = monaco.editor.createModel(files[fileKey].content, files[fileKey].lang);
      editor.setModel(model);
    }

    // Live Output Rendering with Console Override Interceptor
    function updateLivePreview() {
      const iframe = document.getElementById('live-preview');
      const html = files['index.html'] ? files['index.html'].content : '';
      const css = files['styles.css'] ? `<style>${files['styles.css'].content}</style>` : '';
      
      // Inject script to mirror console outputs inside the Lab console
      const consoleOverride = `
        <script>
          (function() {
            const sendLog = (type, args) => {
              window.parent.postMessage({ type: 'CONSOLE_LOG', logType: type, msg: Array.from(args).join(' ') }, '*');
            };
            console.log = (...args) => sendLog('info', args);
            console.error = (...args) => sendLog('error', args);
          })();
        <\/script>
      `;

      const js = files['script.js'] ? `<script>${files['script.js'].content}<\/script>` : '';

      const combinedSource = `
        <!DOCTYPE html>
        <html>
          <head>
            ${css}
            ${consoleOverride}
          </head>
          <body>
            ${html}
            ${js}
          </body>
        </html>
      `;

      iframe.srcdoc = combinedSource;
    }

    // Console Event Listener
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'CONSOLE_LOG') {
        const consoleLogs = document.getElementById('console-logs');
        const entry = document.createElement('div');
        entry.className = `log-entry ${event.data.logType}`;
        entry.innerText = `> ${event.data.msg}`;
        consoleLogs.appendChild(entry);
        consoleLogs.scrollTop = consoleLogs.scrollHeight;
      }
    });

    function clearConsole() {
      document.getElementById('console-logs').innerHTML = '';
    }

    // Settings Menu & Themes
    function toggleSettingsMenu() {
      const menu = document.getElementById('settings-menu');
      menu.classList.toggle('show');
    }

    function setTheme(theme) {
      currentTheme = theme;
      document.body.className = `${theme}-mode`;

      document.getElementById('check-dark').classList.toggle('hidden', theme !== 'dark');
      document.getElementById('check-light').classList.toggle('hidden', theme !== 'light');
      document.getElementById('check-medium').classList.toggle('hidden', theme !== 'medium');

      if (editor) {
        monaco.editor.setTheme(theme === 'light' ? 'vs' : 'vs-dark');
      }

      toggleSettingsMenu();
    }

    function toggleConsole() {
      const consolePanel = document.getElementById('console-panel');
      if (consolePanel.style.display === 'flex') {
        consolePanel.style.display = 'none';
      } else {
        consolePanel.style.display = 'flex';
      }
      toggleSettingsMenu();
    }

    // Fullscreen Toggles
    function toggleFullscreenEditor() {
      const editorSection = document.getElementById('editor-section');
      editorSection.classList.toggle('full-screen-mode');
      if (editor) editor.layout();
    }

    function toggleFullscreenViewer() {
      const outputSection = document.getElementById('output-section');
      outputSection.classList.toggle('full-screen-mode');
    }

    // Close dropdown on outside click
    window.onclick = function(event) {
      if (!event.target.matches('.icon-btn') && !event.target.matches('.fa-gear')) {
        const menu = document.getElementById('settings-menu');
        if (menu && menu.classList.contains('show')) {
          menu.classList.remove('show');
        }
      }
    };
  </script>
</body>
</html>
